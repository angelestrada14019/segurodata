[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # Depends(...) en defaults es el idioma de FastAPI
    "E501",   # line-length lo gobierna el formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests contra servicios reales (Supabase) — excluidos por defecto",
]
addopts = "-m 'not integration'"
