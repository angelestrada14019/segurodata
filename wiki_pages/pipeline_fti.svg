<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="760" fill="#0f1218"/>

  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f5f5f5">Pipeline FTI — Feature / Training / Inference</text>
  <text x="550" y="60" text-anchor="middle" font-size="12" fill="#9aa4b2">Estado final — actualizado 10 julio 2026</text>

  <!-- ===== OFFLINE: Feature + Training ===== -->
  <rect x="30" y="86" width="1040" height="248" rx="8" fill="none" stroke="#4bb374" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="50" y="108" font-size="14" font-weight="700" fill="#4bb374">OFFLINE — Feature + Training (bajo demanda, GitHub Actions workflow_dispatch)</text>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="50" y="122" width="180" height="60" rx="6" fill="#7dd3a8"/>
    <text x="140" y="146" text-anchor="middle" font-size="12">src/pipeline.py</text>
    <text x="140" y="163" text-anchor="middle" font-size="9" font-weight="400">Bronze — 12 fuentes, incremental</text>
  </g>
  <line x1="230" y1="152" x2="264" y2="152" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="266" y="122" width="180" height="60" rx="6" fill="#63c98a"/>
    <text x="356" y="146" text-anchor="middle" font-size="12">src/transform.py</text>
    <text x="356" y="163" text-anchor="middle" font-size="9" font-weight="400">Silver — 111,606 × 20 cols</text>
  </g>
  <line x1="446" y1="152" x2="480" y2="152" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="482" y="122" width="200" height="60" rx="6" fill="#4bb374"/>
    <text x="582" y="141" text-anchor="middle" font-size="12">scripts/train_model.py</text>
    <text x="582" y="157" text-anchor="middle" font-size="9" font-weight="400">Gold (18 vars) + XGBoost</text>
    <text x="582" y="170" text-anchor="middle" font-size="9" font-weight="400">+ SHAP + análisis de sesgo</text>
  </g>
  <line x1="682" y1="152" x2="716" y2="152" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="718" y="122" width="170" height="60" rx="6" fill="#f2c14e"/>
    <text x="803" y="146" text-anchor="middle" font-size="12">quality-gate</text>
    <text x="803" y="163" text-anchor="middle" font-size="9" font-weight="400">macro-F1 / ±1 banda ≥ umbral</text>
  </g>
  <line x1="888" y1="152" x2="922" y2="152" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="924" y="122" width="130" height="60" rx="6" fill="#a78bfa"/>
    <text x="989" y="146" text-anchor="middle" font-size="11">load_model</text>
    <text x="989" y="160" text-anchor="middle" font-size="11">_artifacts.py</text>
    <text x="989" y="174" text-anchor="middle" font-size="8" font-weight="400">→ Supabase</text>
  </g>

  <!-- Rechazo del quality gate -->
  <path d="M 803 182 L 803 220 L 300 220 L 300 152" fill="none" stroke="#e05c5c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowred)"/>
  <text x="550" y="234" text-anchor="middle" font-size="10" fill="#e05c5c">si el modelo nuevo es PEOR: el pipeline se detiene solo, Supabase no se toca (--force para forzar)</text>

  <text x="50" y="266" font-size="11" fill="#9aa4b2">Split temporal DINÁMICO: TEST = últimos 6 meses con datos, se recalcula en cada corrida — no es una fecha fija.</text>
  <text x="50" y="284" font-size="11" fill="#9aa4b2">Probado de punta a punta en CI real (.github/workflows/etl-semanal.yml). El "schedule" semanal queda desactivado</text>
  <text x="50" y="302" font-size="11" fill="#9aa4b2">a propósito por decisión de diseño — se dispara manualmente (workflow_dispatch), nunca "congelado".</text>

  <!-- ===== ONLINE: Inference ===== -->
  <rect x="30" y="358" width="1040" height="330" rx="8" fill="none" stroke="#5ec8ff" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="50" y="380" font-size="14" font-weight="700" fill="#5ec8ff">ONLINE — Inference (siempre activo, sin cold start)</text>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="450" y="404" width="200" height="52" rx="6" fill="#e5e7eb"/>
    <text x="550" y="426" text-anchor="middle" font-size="12">Usuario / Jurado</text>
    <text x="550" y="443" text-anchor="middle" font-size="9" font-weight="400">navegador</text>
  </g>
  <line x1="550" y1="456" x2="550" y2="486" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="380" y="488" width="340" height="52" rx="6" fill="#5ec8ff"/>
    <text x="550" y="510" text-anchor="middle" font-size="12">FRONTEND — React + deck.gl (Vercel)</text>
    <text x="550" y="527" text-anchor="middle" font-size="9" font-weight="400">4 módulos + modal 5 pestañas + Panel Admin</text>
  </g>

  <line x1="470" y1="540" x2="250" y2="574" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="540" x2="850" y2="574" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="70" y="576" width="360" height="70" rx="6" fill="#a78bfa"/>
    <text x="250" y="598" text-anchor="middle" font-size="12">Lectura directa — Supabase (RLS)</text>
    <text x="250" y="615" text-anchor="middle" font-size="9" font-weight="400">geometrías UPZ, predicciones, SHAP,</text>
    <text x="250" y="629" text-anchor="middle" font-size="9" font-weight="400">cuadrantes, infraestructura, change_points</text>
  </g>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="670" y="576" width="360" height="70" rx="6" fill="#ff8a5c"/>
    <text x="850" y="596" text-anchor="middle" font-size="12">BACKEND — FastAPI (Railway)</text>
    <text x="850" y="612" text-anchor="middle" font-size="9" font-weight="400">/predict /explain /graphrag /prescribe</text>
    <text x="850" y="626" text-anchor="middle" font-size="9" font-weight="400">valida JWT ES256/JWKS · aplica rol · rate limit</text>
  </g>

  <line x1="850" y1="646" x2="850" y2="674" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="690" text-anchor="middle" font-size="10" fill="#9aa4b2">lookup en Supabase (nunca inferencia on-demand) + OpenRouter para GraphRAG/prescriptivo</text>

  <line x1="250" y1="646" x2="250" y2="674" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="690" text-anchor="middle" font-size="10" fill="#9aa4b2">predicciones y SHAP son lookup por PK — pre-computados en el pipeline offline de arriba</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e05c5c"/>
    </marker>
  </defs>
</svg>
