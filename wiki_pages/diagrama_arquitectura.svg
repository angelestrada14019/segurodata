<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#0f1218"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#f5f5f5">SeguroData Bogotá — Arquitectura de Fuentes y Pipeline</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#9aa4b2">Estado final — actualizado 10 julio 2026</text>

  <!-- ===================== FUENTES ===================== -->
  <text x="60" y="100" font-size="15" font-weight="700" fill="#e5e7eb">12 fuentes de datos abiertos activas + 1 planificada</text>

  <!-- Grupo 1: estructuradas -> XGBoost -->
  <text x="60" y="122" font-size="11" fill="#9aa4b2">Grupo 1 — estructuradas → XGBoost + mapa</text>
  <g font-size="11" fill="#0f1218" font-weight="600">
    <g transform="translate(60,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F1 DAI</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">Localidad×año</text>
    </g>
    <g transform="translate(162,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F2 UPZ</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">112 polígonos</text>
    </g>
    <g transform="translate(264,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F3 Clima</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">Open-Meteo</text>
    </g>
    <g transform="translate(366,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F4 Cuadrantes</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">599 · MEBOG</text>
    </g>
    <g transform="translate(468,130)">
      <rect width="94" height="36" rx="4" fill="#3ba7e0"/><text x="47" y="15" text-anchor="middle" fill="#0f1218">F5 NUSE</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400" fill="#0f1218">Base: 111,606 filas</text>
    </g>
    <g transform="translate(570,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F6 Hurto PN</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">Benchmarking</text>
    </g>
    <g transform="translate(672,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F7 Estrato</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">44,260 manzanas</text>
    </g>
    <g transform="translate(774,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F8 TransMil.</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">153 estaciones</text>
    </g>
    <g transform="translate(876,130)">
      <rect width="94" height="36" rx="4" fill="#f2c14e"/><text x="47" y="15" text-anchor="middle" fill="#0f1218">F11 Malla vial</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400" fill="#0f1218">placeholder=0</text>
    </g>
    <g transform="translate(978,130)">
      <rect width="94" height="36" rx="4" fill="#5ec8ff"/><text x="47" y="15" text-anchor="middle">F13 Cámaras</text><text x="47" y="28" text-anchor="middle" font-size="9" font-weight="400">92 puntos · real</text>
    </g>
    <g transform="translate(1080,130)">
      <rect width="60" height="36" rx="4" fill="#5ec8ff"/><text x="30" y="15" text-anchor="middle" font-size="10">F14</text><text x="30" y="28" text-anchor="middle" font-size="8" font-weight="400">Alumbrado</text>
    </g>
  </g>

  <!-- Grupo 2: no estructuradas -> GraphRAG -->
  <text x="60" y="196" font-size="11" fill="#9aa4b2">Grupo 2 — no estructuradas → GraphRAG (pgvector)</text>
  <g font-size="11" font-weight="600">
    <g transform="translate(60,204)">
      <rect width="140" height="36" rx="4" fill="#c792ea"/><text x="70" y="15" text-anchor="middle" fill="#0f1218">F10 Noticias RSS</text><text x="70" y="28" text-anchor="middle" font-size="9" font-weight="400" fill="#0f1218">3 feeds · 10 chunks reales</text>
    </g>
    <g transform="translate(212,204)">
      <rect width="140" height="36" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/><text x="70" y="15" text-anchor="middle" fill="#9aa4b2">F12 Plan Desarrollo</text><text x="70" y="28" text-anchor="middle" font-size="9" font-weight="400" fill="#9aa4b2">planificada, Fase 3+</text>
    </g>
  </g>

  <!-- Arrow down to Bronze -->
  <line x1="600" y1="252" x2="600" y2="278" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== MEDALLION ===================== -->
  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="60" y="280" width="1080" height="46" rx="6" fill="#7dd3a8"/>
    <text x="80" y="298" font-size="13">BRONZE</text>
    <text x="80" y="315" font-size="10" font-weight="400">datos/raw/ — src/pipeline.py — descarga incremental, solo lo nuevo</text>
  </g>
  <line x1="600" y1="326" x2="600" y2="350" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="60" y="352" width="1080" height="46" rx="6" fill="#63c98a"/>
    <text x="80" y="370" font-size="13">SILVER</text>
    <text x="80" y="387" font-size="10" font-weight="400">datos/procesados/silver_upz_mes.parquet — src/transform.py — limpieza + spatial joins — 111,606 filas × 20 columnas</text>
  </g>
  <line x1="600" y1="398" x2="600" y2="422" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="60" y="424" width="1080" height="46" rx="6" fill="#4bb374"/>
    <text x="80" y="442" font-size="13">GOLD + MODEL</text>
    <text x="80" y="459" font-size="10" font-weight="400">scripts/train_model.py — 18 variables, XGBoost, SHAP, análisis de sesgo, quality-gate — macro-F1 0.867</text>
  </g>
  <line x1="600" y1="470" x2="600" y2="494" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SUPABASE ===================== -->
  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="60" y="496" width="1080" height="56" rx="6" fill="#a78bfa"/>
    <text x="80" y="518" font-size="14">SUPABASE — PostgreSQL + PostGIS + pgvector</text>
    <text x="80" y="538" font-size="10" font-weight="400">predicciones · shap_values · upz_geometrias · cuadrantes_geom · transmilenio_geom · camaras_geom · upz_infraestructura · change_points · documents_corpus · Auth + RLS por rol</text>
  </g>
  <line x1="600" y1="552" x2="600" y2="576" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SERVING LAYER ===================== -->
  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="120" y="578" width="440" height="70" rx="6" fill="#ff8a5c"/>
    <text x="140" y="600" font-size="14">BACKEND — FastAPI (Railway)</text>
    <text x="140" y="617" font-size="10" font-weight="400">/predict /explain /graphrag /prescribe /whoami /admin</text>
    <text x="140" y="632" font-size="10" font-weight="400">JWT ES256/JWKS · rate limiting · siempre activo, sin cold start</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0f1218">
    <rect x="620" y="578" width="460" height="70" rx="6" fill="#5ec8ff"/>
    <text x="640" y="600" font-size="14">FRONTEND — React + deck.gl (Vercel)</text>
    <text x="640" y="617" font-size="10" font-weight="400">4 módulos + modal 5 pestañas + Panel Admin</text>
    <text x="640" y="632" font-size="10" font-weight="400">lee Supabase directo (RLS) + llama al backend para lógica de rol/LLM</text>
  </g>
  <line x1="560" y1="613" x2="620" y2="613" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <g font-size="12" font-weight="700" fill="#0f1218">
    <rect x="200" y="672" width="280" height="42" rx="6" fill="#f2c14e"/>
    <text x="340" y="690" text-anchor="middle" font-size="12">OpenRouter</text>
    <text x="340" y="705" text-anchor="middle" font-size="9" font-weight="400">Gemini Flash (primario) — GraphRAG + prescriptivo</text>
  </g>
  <line x1="340" y1="648" x2="340" y2="672" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="760" text-anchor="middle" font-size="11" fill="#6b7280">https://segurodata-frontend.vercel.app · https://segurodata-api-production.up.railway.app</text>
  <text x="600" y="780" text-anchor="middle" font-size="11" fill="#6b7280">12 fuentes activas (F1–F8, F10, F11, F13, F14) + F12 planificada · repositorio público</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
