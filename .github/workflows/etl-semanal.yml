# Pipeline de datos + reentrenamiento — SeguroData Bogota
#
# ESTADO: DESACTIVADO (el cron semanal sigue comentado)
# Para activar el cron: descomentar el bloque "schedule" de abajo y hacer commit.
# Recomendacion del equipo (10-jul-2026): no activar el cron antes de la
# sustentacion oral. Probar primero varias veces via "Run workflow" manual.
#
# Que hace (cadena completa Bronze -> Silver -> Model -> Supabase):
#   1. src/pipeline.py       -- descarga incremental F3/F5/F6 (Bronze)
#   2. src/transform.py      -- Bronze -> Silver (nunca se llamaba antes; sin
#                                este paso, "activar el cron" no alcanzaba)
#   3. scripts/train_model.py       -- Silver -> Gold -> XGBoost + SHAP,
#                                       split temporal dinamico
#   4. scripts/load_model_artifacts.py -- carga a Supabase, PERO SOLO SI
#      pasa el quality-gate de metricas.json (macro_f1/accuracy_within_1_band
#      contra umbrales minimos) -- si el modelo nuevo es peor, este paso
#      falla y el job se detiene ANTES de tocar Supabase y antes de commitear
#      nada de vuelta al repo.
#
# Los pasos 2-4 se pueden saltar con el input "retrain=false" (solo refresca
# datos crudos, como el workflow original).

on:
  # schedule:
  #   - cron: '0 6 * * 1'   # cada lunes a las 6am UTC (1am Bogota)

  # Permite lanzar manualmente desde GitHub Actions > Run workflow
  workflow_dispatch:
    inputs:
      sources:
        description: 'Fuentes a actualizar (ej: f3 f5 f6). Dejar vacio para las 3 por defecto.'
        required: false
        default: 'f3 f5 f6'
      force:
        description: 'Forzar re-descarga aunque no haya cambios'
        required: false
        default: 'false'
        type: boolean
      retrain:
        description: 'Correr tambien transform+train+load (cadena completa). false = solo ETL de datos crudos.'
        required: false
        default: 'true'
        type: boolean

jobs:
  etl:
    name: Pipeline de datos y reentrenamiento
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install supabase>=2.6.0

      - name: Correr pipeline ETL (Bronze)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'f3 f5 f6' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python src/pipeline.py --source $SOURCES $FORCE_FLAG --verbose

      - name: Verificar archivos generados
        run: |
          echo "--- Archivos en datos/raw/ ---"
          ls -lh datos/raw/ || echo "(vacio)"
          echo ""
          echo "--- Estado del pipeline ---"
          python src/pipeline.py --status

      - name: Transformar Bronze -> Silver
        if: github.event.inputs.retrain != 'false'
        run: python src/transform.py --verbose

      - name: Reentrenar modelo (Gold + XGBoost + SHAP)
        if: github.event.inputs.retrain != 'false'
        run: python scripts/train_model.py --verbose

      - name: Cargar a Supabase (gateado por quality-check de metricas)
        if: github.event.inputs.retrain != 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_model_artifacts.py

      - name: Commitear datos y artefactos actualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: pipeline automatico ${{ github.run_id }} — fuentes ${{ github.event.inputs.sources || 'f3 f5 f6' }}"
          file_pattern: "datos/raw/*.parquet datos/raw/.pipeline_state.json datos/procesados/*.parquet datos/procesados/.transform_state.json datos/features/*.parquet datos/modelos/metricas.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
